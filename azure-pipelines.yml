trigger: none
pr: none

parameters:
  - name: image
    type: string
    default: windows-2025
    values:
      - windows-2025
      - windows-2022
  - name: versionMode
    type: string
    default: OtherVersion
    values:
      - OtherVersion
      - LatestVersion
  - name: azVersion
    type: string
    default: '15.6.1'
  - name: azureServiceConnection
    type: string
    default: ''

variables:
  system.debug: true

jobs:
  - job: InstalledBundle
    displayName: Verify local Az bundle without Gallery access
    timeoutInMinutes: 10
    pool:
      vmImage: ${{ parameters.image }}
    steps:
      - checkout: none
      - task: PowerShell@2
        displayName: Discover and import preinstalled Az
        env:
          REPRO_VERSION_MODE: ${{ parameters.versionMode }}
          REPRO_AZ_VERSION: ${{ parameters.azVersion }}
        inputs:
          targetType: inline
          pwsh: false
          script: |
            $ErrorActionPreference = 'Stop'
            Write-Host "Image: $env:ImageOS $env:ImageVersion"
            Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
            $root = 'C:\Modules'
            if (-not (Test-Path -LiteralPath $root -PathType Container)) {
              throw "Hosted module cache does not exist: $root"
            }
            $bundles = @(Get-ChildItem -LiteralPath $root | ForEach-Object {
              if ($_.Name -match '^az_(\d+\.\d+\.\d+)(?:\.zip)?$') {
                [pscustomobject]@{ Version = [version]$Matches[1]; Path = $_.FullName }
              }
            })
            $bundles | Format-Table -AutoSize | Out-Host
            if ($env:REPRO_VERSION_MODE -eq 'LatestVersion') {
              $selected = $bundles | Sort-Object Version -Descending | Select-Object -First 1
            } else {
              $requested = [version]$env:REPRO_AZ_VERSION
              $selected = $bundles | Where-Object Version -eq $requested | Select-Object -First 1
            }
            if ($null -eq $selected) {
              throw "Requested local Az bundle is unavailable. No Gallery download will be attempted."
            }
            $version = $selected.Version.ToString()
            $bundlePath = Join-Path $root "az_$version"
            if (-not (Test-Path -LiteralPath $bundlePath -PathType Container)) {
              Write-Host "Expanding existing local bundle: $($selected.Path)"
              Expand-Archive -LiteralPath $selected.Path -DestinationPath $root
            }
            $manifest = Join-Path $bundlePath "Az\$version\Az.psd1"
            if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "Local bundle is incomplete; required manifest is missing: $manifest"
            }
            $env:PSModulePath = $bundlePath + [IO.Path]::PathSeparator + $env:PSModulePath
            Import-Module Az -RequiredVersion $version -ErrorAction Stop
            $loaded = Get-Module Az
            if ($null -eq $loaded -or $loaded.Version -ne $selected.Version) {
              throw "Requested Az version was not imported."
            }
            $loaded | Select-Object Name, Version, ModuleBase | Format-List | Out-Host
            Write-Host "PASS: Az $version imported from the local bundle. No Gallery download commands were executed."

  # A separate job tests the real task on an unmodified hosted agent.
  - ${{ if ne(parameters.azureServiceConnection, '') }}:
      - job: AzurePowerShellTask
        displayName: Test real Azure PowerShell initialization
        timeoutInMinutes: 10
        pool:
          vmImage: ${{ parameters.image }}
        steps:
          - checkout: none
          - task: AzurePowerShell@5
            displayName: Initialize selected installed version without resource changes
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              ScriptType: InlineScript
              Inline: |
                Write-Host 'Azure PowerShell initialization succeeded.'
                Get-Module Az* | Select-Object Name, Version, ModuleBase
              azurePowerShellVersion: ${{ parameters.versionMode }}
              preferredAzurePowerShellVersion: ${{ parameters.azVersion }}
              pwsh: false
