pool:
  vmImage: 'ubuntu-26.04'

steps:
- task: JavaToolInstaller@0
  displayName: 'Select Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- bash: |
    java -version
    javac -version
  displayName: 'Verify Java 17'

# Existing build and unit-test steps follow here.